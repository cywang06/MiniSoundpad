name: Build & Release

# 推送 v* 标签（例如 v0.2.0）时自动打包并发布到 Releases；
# 普通推送和 PR 只做编译检查。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Publish (self-contained single exe)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$ver `
            -o publish
          Compress-Archive -Path publish/MiniSoundpad.exe -DestinationPath "MiniSoundpad-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MiniSoundpad-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
