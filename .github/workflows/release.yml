name: Build & Release

# 每次推送到 main 都会编译检查。
# 如果 MiniSoundpad.csproj 里的 <Version> 还没有对应的 vX.Y.Z 发布，
# 就自动打包成单个 exe，打上标签并发布到 Releases。
# 想发新版本：把 <Version> 改大，推送到 main 即可。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Decide whether to release
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $v = "${{ github.ref_name }}".TrimStart('v')
            $release = $true
          } else {
            [xml]$proj = Get-Content MiniSoundpad.csproj
            $v = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1).Trim()
            $exists = git ls-remote --tags origin "refs/tags/v$v"
            $release = ("${{ github.event_name }}" -ne "pull_request") -and ("${{ github.ref }}" -eq "refs/heads/main") -and (-not $exists)
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, release: $release"

      - name: Publish (self-contained single exe)
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$v `
            -o publish
          Compress-Archive -Path publish/MiniSoundpad.exe -DestinationPath "MiniSoundpad-v$v-win-x64.zip"

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mini Soundpad v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: MiniSoundpad-v${{ steps.ver.outputs.version }}-win-x64.zip
          generate_release_notes: true
